name: Windows build and core tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unified app and test the reusable brain
        shell: powershell
        run: .\build.ps1 -Test
      - name: Test chat transport and encrypted settings (no network calls)
        shell: powershell
        run: .\test-chat.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BouncyIcons-Windows
          path: |
            dist/BouncyIcons.exe
            dist/assets/
            dist/使用说明.txt
